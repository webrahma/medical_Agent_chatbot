[project]
name = "medical-agent-chatbot"
version = "0.1.0"
description = "Medical Agentic Chatbot built with LangGraph, Groq, Pinecone, Tavily, and FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9",
    "python-dotenv>=1,<2",
    "pydantic-settings>=2,<3",
    "langgraph>=0.3,<2",
    "langchain-core>=0.3,<1",
    "langchain-groq>=0.2,<1",
    "pinecone>=6,<9",
    "tavily-python>=0.5,<1",
    "pymupdf>=1.24,<2",
    "certifi>=2024",
    "httpx>=0.27,<1",
]